<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Magic Key Adventure | 魔法鑰匙時空冒險</title>
  
  <!-- 引入兒童易讀字體 Andika (單層 a 與 g) 與中文圓體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Andika:ital,wght@0,400;0,700;1,400&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. 基礎設定與平板滿版鎖定 (100dvh, 防捲動, 觸控友善)
       ========================================================================== */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh; /* 鎖定動態視窗高度，防止平板上下捲動 */
      overflow: hidden;
      font-family: 'Andika', 'Noto Sans TC', sans-serif;
      background-color: #1e293b;
      color: #1e293b;
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100dvh;
      max-width: 1024px;
      margin: 0 auto;
      background: #ffffff;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
    }

    /* ==========================================================================
       2. 頂部進度列：魔法鑰匙能量寶石進度條
       ========================================================================== */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      color: #fff;
      z-index: 20;
      min-height: 58px;
    }

    .stage-badge {
      font-size: 1rem;
      font-weight: 700;
      background: #334155;
      padding: 6px 14px;
      border-radius: 999px;
      letter-spacing: 0.5px;
      border: 2px solid #475569;
    }

    .gem-tracker {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .gem-slot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 2px dashed rgba(255, 255, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .gem-slot.collected {
      background: radial-gradient(circle, #fde047 0%, #eab308 100%);
      border: 2px solid #fef08a;
      box-shadow: 0 0 12px #facc15;
      transform: scale(1.15);
    }

    /* ==========================================================================
       3. 上半部：時空場景舞台區 (佔約 42% ~ 45%)
       ========================================================================== */
    .stage-viewport {
      flex: 0 0 43%;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      transition: background 0.8s ease;
      overflow: hidden;
    }

    /* 背景裝飾光暈與時空漩渦 */
    .portal-ring {
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      border: 6px dashed rgba(255, 255, 255, 0.25);
      animation: spinSlow 24s linear infinite;
      pointer-events: none;
    }

    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* 場景視覺主舞台 */
    .scene-actors {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      z-index: 5;
      width: 100%;
      max-width: 680px;
    }

    /* 魔法鑰匙發光動畫 */
    .magic-key-wrapper {
      cursor: pointer;
      padding: 10px;
      border-radius: 24px;
      transition: transform 0.15s ease;
      animation: floatKey 3s ease-in-out infinite;
    }

    .magic-key-wrapper:active {
      transform: scale(0.92);
    }

    .magic-key-svg {
      width: 110px;
      height: 110px;
      filter: drop-shadow(0 0 12px rgba(253, 224, 71, 0.8));
      animation: keyGlow 2s ease-in-out infinite alternate;
    }

    @keyframes keyGlow {
      0% { filter: drop-shadow(0 0 8px rgba(253, 224, 71, 0.6)); transform: scale(1); }
      100% { filter: drop-shadow(0 0 24px rgba(254, 240, 138, 1)); transform: scale(1.06); }
    }

    @keyframes floatKey {
      0%, 100% { transform: translateY(0px) rotate(-6deg); }
      50% { transform: translateY(-10px) rotate(4deg); }
    }

    /* 小狗 Floppy 與場景道具容器 */
    .character-card {
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(6px);
      border: 3px solid rgba(255, 255, 255, 0.45);
      border-radius: 24px;
      padding: 12px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }

    .floppy-bounce {
      animation: floppyJump 2.2s ease-in-out infinite;
    }

    @keyframes floppyJump {
      0%, 100% { transform: translateY(0); }
      40% { transform: translateY(-8px); }
      60% { transform: translateY(0); }
    }

    .scene-visual-box {
      font-size: 3.4rem;
      line-height: 1.2;
      text-align: center;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
    }

    .scene-caption {
      margin-top: 6px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    /* ==========================================================================
       4. 下半部：故事對話框與互動答題區 (佔約 55% ~ 57%)
       ========================================================================== */
    .story-panel {
      flex: 1;
      background: #f8fafc;
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      margin-top: -18px;
      z-index: 10;
      padding: 18px 22px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.12);
    }

    /* 故事短文卡片與朗讀按鈕 */
    .story-box {
      background: #ffffff;
      border: 3px solid #e2e8f0;
      border-radius: 20px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: 0 4px 10px rgba(148, 163, 184, 0.15);
    }

    .story-text {
      font-size: clamp(1.25rem, 2.5vw, 1.55rem);
      line-height: 1.6;
      color: #0f172a;
      margin: 0;
      font-weight: 400;
    }

    .story-text strong {
      color: #2563eb;
      font-weight: 700;
    }

    /* 語音朗讀按鈕 (高度 >= 64px，觸控友善) */
    .btn-read {
      flex-shrink: 0;
      min-width: 68px;
      height: 68px;
      border-radius: 18px;
      border: none;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: #ffffff;
      font-size: 1.6rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 5px 0 #1d4ed8;
      transition: transform 0.1s ease;
    }

    .btn-read span {
      font-size: 0.75rem;
      font-weight: 700;
      margin-top: 2px;
    }

    .btn-read:active {
      transform: translateY(4px) scale(0.96);
      box-shadow: 0 1px 0 #1d4ed8;
    }

    /* 任務問題提示區 */
    .question-area {
      text-align: center;
      margin: 8px 0;
    }

    .question-prompt {
      font-size: clamp(1.2rem, 2.3vw, 1.45rem);
      font-weight: 700;
      color: #334155;
      line-height: 1.5;
      margin: 0;
    }

    .blank-slot {
      display: inline-block;
      min-width: 110px;
      padding: 0 12px;
      border-bottom: 4px solid #f59e0b;
      color: #d97706;
      font-weight: 700;
      text-align: center;
    }

    /* ==========================================================================
       5. 互動選項按鈕區 (所有按鈕高度 >= 64px，無 Hover，明確 :active 回饋)
       ========================================================================== */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      width: 100%;
    }

    .options-grid.single-col {
      grid-template-columns: 1fr;
    }

    .btn-option {
      min-height: 68px; /* 嚴格大於 64px */
      padding: 12px 16px;
      font-family: 'Andika', 'Noto Sans TC', sans-serif;
      font-size: clamp(1.2rem, 2.2vw, 1.45rem);
      font-weight: 700;
      color: #1e293b;
      background: #ffffff;
      border: 3px solid #cbd5e1;
      border-radius: 18px;
      box-shadow: 0 5px 0 #cbd5e1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    .btn-option:active {
      transform: translateY(4px) scale(0.97);
      box-shadow: 0 1px 0 #cbd5e1;
    }

    /* 答對與答錯狀態樣式 */
    .btn-option.correct {
      background: #22c55e;
      border-color: #16a34a;
      box-shadow: 0 5px 0 #15803d;
      color: #ffffff;
    }

    .btn-option.wrong {
      background: #fee2e2;
      border-color: #ef4444;
      box-shadow: 0 5px 0 #dc2626;
      color: #b91c1c;
      animation: shakeBtn 0.35s ease;
    }

    @keyframes shakeBtn {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    /* 關卡 4：句子排序 (Sentence Builder) 專用樣式 */
    .sentence-builder-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .sentence-slots {
      min-height: 68px;
      background: #eff6ff;
      border: 3px dashed #60a5fa;
      border-radius: 18px;
      padding: 8px 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .word-tiles-pool {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .btn-word-tile {
      min-height: 66px;
      font-family: 'Andika', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      background: #fef3c7;
      border: 3px solid #f59e0b;
      box-shadow: 0 5px 0 #d97706;
      color: #92400e;
      border-radius: 16px;
      cursor: pointer;
    }

    .btn-word-tile:active {
      transform: translateY(4px) scale(0.96);
      box-shadow: 0 1px 0 #d97706;
    }

    .btn-word-tile.used {
      opacity: 0.35;
      pointer-events: none;
    }

    .built-chip {
      padding: 10px 16px;
      background: #3b82f6;
      color: #fff;
      border-radius: 14px;
      font-size: 1.25rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* ==========================================================================
       6. 過關回饋彈窗 (自製 Message Box，絕不使用 alert)
       ========================================================================== */
    .feedback-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(4px);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .feedback-overlay.show {
      display: flex;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .feedback-card {
      background: #ffffff;
      border-radius: 28px;
      padding: 28px 24px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      border: 4px solid #facc15;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      animation: popUp 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popUp {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .feedback-emoji {
      font-size: 4rem;
      margin-bottom: 8px;
    }

    .feedback-title {
      font-size: 1.65rem;
      font-weight: 700;
      color: #16a34a;
      margin: 0 0 10px;
    }

    .feedback-text {
      font-size: 1.3rem;
      line-height: 1.6;
      color: #334155;
      margin: 0 0 22px;
    }

    .btn-next {
      width: 100%;
      min-height: 68px;
      border-radius: 20px;
      border: none;
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      color: #ffffff;
      font-family: 'Andika', 'Noto Sans TC', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      box-shadow: 0 6px 0 #15803d;
      cursor: pointer;
    }

    .btn-next:active {
      transform: translateY(4px) scale(0.97);
      box-shadow: 0 2px 0 #15803d;
    }

    /* 直向平板與小螢幕自適應微調 */
    @media (max-width: 680px) {
      .options-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .word-tiles-pool {
        grid-template-columns: repeat(2, 1fr);
      }
      .stage-viewport {
        flex: 0 0 38%;
      }
    }
  </style>
</head>
<body>

<div id="app">
  <!-- 頂部進度列：關卡名稱 + 5 顆魔法寶石進度條 -->
  <header class="top-bar">
    <div class="stage-badge" id="stageTitleBadge">Prologue: The Magic Key</div>
    <div class="gem-tracker" aria-label="Magic Gems Progress">
      <div class="gem-slot" id="gem-0">💎</div>
      <div class="gem-slot" id="gem-1">💎</div>
      <div class="gem-slot" id="gem-2">💎</div>
      <div class="gem-slot" id="gem-3">💎</div>
      <div class="gem-slot" id="gem-4">💎</div>
    </div>
  </header>

  <!-- 上半部：時空場景舞台區 (43%) -->
  <section class="stage-viewport" id="stageViewport">
    <div class="portal-ring"></div>
    
    <div class="scene-actors">
      <!-- 內嵌 SVG：發光的魔法鑰匙 (點擊也可觸發閃亮音效與朗讀) -->
      <div class="magic-key-wrapper" id="magicKeyBtn" title="Tap the Magic Key!">
        <svg class="magic-key-svg" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="goldGrad" x1="15" y1="15" x2="105" y2="105" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#FEF08A"/>
              <stop offset="50%" stop-color="#FACC15"/>
              <stop offset="100%" stop-color="#CA8A04"/>
            </linearGradient>
          </defs>
          <!-- 鑰匙光環 -->
          <circle cx="42" cy="42" r="24" stroke="url(#goldGrad)" stroke-width="9" fill="rgba(254, 240, 138, 0.25)"/>
          <circle cx="42" cy="42" r="10" stroke="#FEF9C3" stroke-width="3"/>
          <!-- 鑰匙柄身 -->
          <path d="M59 59L98 98" stroke="url(#goldGrad)" stroke-width="11" stroke-linecap="round"/>
          <!-- 鑰匙齒痕 -->
          <path d="M82 82L94 70" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round"/>
          <path d="M93 93L106 80" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round"/>
          <!-- 魔法星星閃光 -->
          <path d="M22 14L24 20L30 22L24 24L22 30L20 24L14 22L20 20L22 14Z" fill="#FFFFFF"/>
          <path d="M96 32L98 37L103 39L98 41L96 46L94 41L89 39L94 37L96 32Z" fill="#FEF08A"/>
        </svg>
      </div>

      <!-- 內嵌 SVG：小狗 Floppy 頭像 -->
      <div class="character-card floppy-bounce">
        <svg width="78" height="78" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <!-- 垂下的耳朵 -->
          <ellipse cx="22" cy="54" rx="12" ry="22" transform="rotate(15 22 54)" fill="#92400E"/>
          <ellipse cx="78" cy="54" rx="12" ry="22" transform="rotate(-15 78 54)" fill="#92400E"/>
          <!-- 臉部 -->
          <circle cx="50" cy="50" r="30" fill="#D97706"/>
          <!-- 淺色口鼻區 -->
          <ellipse cx="50" cy="60" rx="17" ry="13" fill="#FDE68A"/>
          <!-- 眼睛 -->
          <circle cx="39" cy="44" r="4.5" fill="#1E293B"/>
          <circle cx="61" cy="44" r="4.5" fill="#1E293B"/>
          <circle cx="40.5" cy="42.5" r="1.5" fill="#FFFFFF"/>
          <circle cx="62.5" cy="42.5" r="1.5" fill="#FFFFFF"/>
          <!-- 鼻子與微笑 -->
          <ellipse cx="50" cy="54" rx="6" ry="4" fill="#1E293B"/>
          <path d="M43 63Q50 70 57 63" stroke="#1E293B" stroke-width="3" stroke-linecap="round" fill="none"/>
        </svg>
        <span class="scene-caption">Floppy</span>
      </div>

      <!-- 動態場景元素 (依關卡變化) -->
      <div class="character-card" id="scenePropCard">
        <div class="scene-visual-box" id="sceneVisualEmoji">🏠🔑✨</div>
        <span class="scene-caption" id="sceneCaptionText">Biff & Chip's Room</span>
      </div>
    </div>
  </section>

  <!-- 下半部：故事對話框與互動選項區 (57%) -->
  <main class="story-panel">
    <!-- 故事短文 + 朗讀按鈕 -->
    <div class="story-box">
      <p class="story-text" id="storyTextDisplay">
        Biff and Chip were in the room. Suddenly, <strong>the magic key began to glow!</strong>
      </p>
      <button class="btn-read" id="readAloudBtn" type="button" aria-label="Read Aloud">
        🔊
        <span>Read</span>
      </button>
    </div>

    <!-- 任務題目區 -->
    <div class="question-area">
      <p class="question-prompt" id="questionPromptDisplay">
        Tap the glowing magic key to start the adventure!
      </p>
    </div>

    <!-- 動態互動區 (選擇題 / 句子重組 / 開始按鈕) -->
    <div id="interactionContainer"></div>
  </main>

  <!-- 過關獎勵與劇情推進彈窗 -->
  <div class="feedback-overlay" id="feedbackOverlay">
    <div class="feedback-card">
      <div class="feedback-emoji" id="feedbackEmoji">💎✨</div>
      <h2 class="feedback-title" id="feedbackTitle">Great Job!</h2>
      <p class="feedback-text" id="feedbackMessage">You found a Magic Gem!</p>
      <button class="btn-next" id="nextStageBtn" type="button">Continue Adventure ➔</button>
    </div>
  </div>
</div>

<script>
/**
 * ============================================================================
 * 【關卡劇本資料區 STORY_STAGES】
 * ----------------------------------------------------------------------------
 * 教師或開發者可直接修改此陣列，或依相同格式新增《牛津閱讀樹》新關卡：
 * - id: 關卡編號
 * - type: 關卡互動類型 ('intro' 序章 | 'choice' 選擇題 | 'builder' 句子排序 | 'ending' 終章)
 * - title: 頂部顯示的關卡標題
 * - bgGradient: 上半部時空舞台的背景 CSS 漸層
 * - sceneEmoji: 場景視覺主圖示 (支援 Emoji 或自訂 SVG)
 * - sceneLabel: 場景圖示下方的英文標籤
 * - storyText: 故事短文 (支援 <strong> 標記核心句型)
 * - readText: 語音朗讀機唸出的純英文句子
 * - question: 任務問題提示
 * - options: 選擇題選項陣列 (type 為 'choice' 時使用)
 * - words: 打亂的單字陣列 (type 為 'builder' 時使用)
 * - answer: 正確答案 (字串)
 * - feedbackTitle: 答對彈窗標題
 * - feedback: 答對後的劇情推進語 (同時會自動朗讀)
 * - rewardGemIndex: 過關後點亮的寶石索引 (0 ~ 4)
 * ============================================================================
 */
const STORY_STAGES = [
  {
    id: 0,
    type: 'intro',
    title: 'Prologue: The Magic Key',
    bgGradient: 'linear-gradient(135deg, #312e81 0%, #4f46e5 50%, #7c3aed 100%)',
    sceneEmoji: '🏠🔑✨',
    sceneLabel: "The Bedroom",
    storyText: 'Biff and Chip looked at the box. Suddenly, <strong>the magic key began to glow!</strong>',
    readText: 'Biff and Chip looked at the box. Suddenly, the magic key began to glow!',
    question: 'What is happening to the magic key?',
    options: ['✨ Touch the Magic Key! (啟動魔法鑰匙)'],
    answer: '✨ Touch the Magic Key! (啟動魔法鑰匙)',
    feedbackTitle: 'Whoosh! Time Travel!',
    feedback: 'The magic key pulled Biff, Chip, and Floppy into a new world!',
    rewardGemIndex: 0
  },
  {
    id: 1,
    type: 'choice',
    title: 'Stage 1: Land of the Dinosaurs',
    bgGradient: 'linear-gradient(135deg, #065f46 0%, #10b981 55%, #84cc16 100%)',
    sceneEmoji: '🦕🌴🌋',
    sceneLabel: 'Dinosaur Jungle',
    storyText: 'Biff and Chip went to a hot jungle. A big dinosaur <strong>______</strong> at Floppy!',
    readText: 'Biff and Chip went to a hot jungle. A big dinosaur looked at Floppy!',
    question: 'Choose the right past-tense verb (選擇正確的過去式動詞):',
    options: ['looked', 'sleeping', 'banana'],

/**
 * ============================================================================
 * 【Web Audio API 音效合成器】(無外部音檔，純程式碼產生魔法音效)
 * ============================================================================
 */
class MagicSoundFX {
  constructor() {
    this.ctx = null;
  }

  init() {
    if (!this.ctx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioContext();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  // 魔法鑰匙閃亮音效 (快速上升琶音)
  playMagicSparkle() {
    this.init();
    const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51]; // C5 E5 G5 C6 E6
    notes.forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.07);
      gain.gain.setValueAtTime(0.18, this.ctx.currentTime + idx * 0.07);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.07 + 0.35);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(this.ctx.currentTime + idx * 0.07);
      osc.stop(this.ctx.currentTime + idx * 0.07 + 0.36);
    });
  }

  // 答對前進勝利音效
  playSuccess() {
    this.init();
    const notes = [587.33, 739.99, 880.00, 1174.66]; // D5 F#5 A5 D6
    notes.forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.09);
      gain.gain.setValueAtTime(0.22, this.ctx.currentTime + idx * 0.09);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.09 + 0.4);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(this.ctx.currentTime + idx * 0.09);
      osc.stop(this.ctx.currentTime + idx * 0.09 + 0.42);
    });
  }

  // 答錯時的柔和提示音 (不刺耳的低音雙音)
  playGentleTryAgain() {
    this.init();
    const notes = [330, 277.18];
    notes.forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.14);
      gain.gain.setValueAtTime(0.15, this.ctx.currentTime + idx * 0.14);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.14 + 0.28);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(this.ctx.currentTime + idx * 0.14);
      osc.stop(this.ctx.currentTime + idx * 0.14 + 0.3);
    });
  }
}

const sfx = new MagicSoundFX();

/**
 * ============================================================================
 * 【Web Speech API 英語語音朗讀引擎】
 * ============================================================================
 */
function speakEnglish(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel(); // 停止前一段朗讀
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'en-GB'; // 牛津閱讀樹經典英式發音 (若裝置無 en-GB 會自動 fallback 至 en-US)
  utterance.rate = 0.88;    // 適合兒童聽力與跟讀的語速
  utterance.pitch = 1.05;
  window.speechSynthesis.speak(utterance);
}

/**
 * ============================================================================
 * 【遊戲核心狀態與畫面渲染控制】
 * ============================================================================
 */
let currentStageIndex = 0;
let collectedGems = [false, false, false, false, false];
let builtWords = []; // 關卡 4 句子重組暫存陣列

// DOM 元素快取
const stageTitleBadge = document.getElementById('stageTitleBadge');
const stageViewport = document.getElementById('stageViewport');
const sceneVisualEmoji = document.getElementById('sceneVisualEmoji');
const sceneCaptionText = document.getElementById('sceneCaptionText');
const storyTextDisplay = document.getElementById('storyTextDisplay');
const questionPromptDisplay = document.getElementById('questionPromptDisplay');
const interactionContainer = document.getElementById('interactionContainer');
const readAloudBtn = document.getElementById('readAloudBtn');
const magicKeyBtn = document.getElementById('magicKeyBtn');
const feedbackOverlay = document.getElementById('feedbackOverlay');
const feedbackTitle = document.getElementById('feedbackTitle');
const feedbackMessage = document.getElementById('feedbackMessage');
const nextStageBtn = document.getElementById('nextStageBtn');

// 更新頂部 5 顆寶石進度條
function renderGemTracker() {
  collectedGems.forEach((isCollected, idx) => {
    const slot = document.getElementById(`gem-${idx}`);
    if (isCollected) {
      slot.classList.add('collected');
    } else {
      slot.classList.remove('collected');
    }
  });
}

// 渲染當前關卡畫面
function loadStage(index) {
  currentStageIndex = index;
  const stage = STORY_STAGES[index];
  builtWords = [];

  // 1. 更新頂部標題與背景漸層
  stageTitleBadge.textContent = stage.title;
  stageViewport.style.background = stage.bgGradient;
  sceneVisualEmoji.textContent = stage.sceneEmoji;
  sceneCaptionText.textContent = stage.sceneLabel;

  // 2. 更新故事短文與任務提示
  storyTextDisplay.innerHTML = stage.storyText;
  questionPromptDisplay.textContent = stage.question;

  // 3. 綁定朗讀按鈕事件
  readAloudBtn.onclick = () => {
    sfx.init();
    speakEnglish(stage.readText);
  };

  // 4. 根據關卡類型渲染互動按鈕
  interactionContainer.innerHTML = '';

  if (stage.type === 'intro' || stage.type === 'ending') {
    const grid = document.createElement('div');
    grid.className = 'options-grid single-col';

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn-option correct';
    btn.textContent = stage.options[0];
    btn.onclick = () => {
      if (stage.type === 'intro') {
        sfx.playMagicSparkle();
        handleStageSuccess(stage);
      } else {
        // 終章重新開始遊戲
        sfx.playMagicSparkle();
        collectedGems = [false, false, false, false, false];
        renderGemTracker();
        loadStage(0);
      }
    };
    grid.appendChild(btn);
    interactionContainer.appendChild(grid);

  } else if (stage.type === 'choice') {
    const grid = document.createElement('div');
    grid.className = 'options-grid';

    stage.options.forEach(optionText => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn-option';
      btn.textContent = optionText;

      btn.onclick = () => {
        if (optionText === stage.answer) {
          btn.classList.add('correct');
          sfx.playSuccess();
          // 將故事句子中的底線替換為正確答案
          storyTextDisplay.innerHTML = stage.storyText.replace('______', optionText);
          setTimeout(() => handleStageSuccess(stage), 450);
        } else {
          btn.classList.add('wrong');
          sfx.playGentleTryAgain();
          speakEnglish('Try again!');
          setTimeout(() => btn.classList.remove('wrong'), 600);
        }
      };

      grid.appendChild(btn);
    });

    interactionContainer.appendChild(grid);

  } else if (stage.type === 'builder') {
    renderSentenceBuilder(stage);
  }

  // 自動朗讀本關故事 (延遲 400ms 讓轉場順暢)
  setTimeout(() => {
    speakEnglish(stage.readText);
  }, 400);
}

// 渲染關卡 4：句子重組互動 (Sentence Builder)
function renderSentenceBuilder(stage) {
  const wrapper = document.createElement('div');
  wrapper.className = 'sentence-builder-box';

  // 已選單字放置槽
  const slotsBox = document.createElement('div');
  slotsBox.className = 'sentence-slots';
  slotsBox.id = 'sentenceSlots';
  slotsBox.innerHTML = '<span style="color:#64748b; font-size:1.1rem;">Tap the yellow word cards below 👇</span>';

  // 打亂的單字按鈕池
  const poolBox = document.createElement('div');
  poolBox.className = 'word-tiles-pool';

  stage.words.forEach((word, idx) => {
    const tileBtn = document.createElement('button');
    tileBtn.type = 'button';
    tileBtn.className = 'btn-word-tile';
    tileBtn.textContent = word;
    tileBtn.dataset.index = idx;

    tileBtn.onclick = () => {
      sfx.init();
      speakEnglish(word.replace('.', ''));
      tileBtn.classList.add('used');
      builtWords.push({ word, idx });
      updateSentenceSlots(stage, poolBox);
    };

    poolBox.appendChild(tileBtn);
  });

  wrapper.appendChild(slotsBox);
  wrapper.appendChild(poolBox);
  interactionContainer.appendChild(wrapper);
}

// 更新句子重組放置槽並檢查是否完成
function updateSentenceSlots(stage, poolBox) {
  const slotsBox = document.getElementById('sentenceSlots');
  slotsBox.innerHTML = '';

  if (builtWords.length === 0) {
    slotsBox.innerHTML = '<span style="color:#64748b; font-size:1.1rem;">Tap the yellow word cards below 👇</span>';
    return;
  }

  builtWords.forEach((item, arrPos) => {
    const chip = document.createElement('span');
    chip.className = 'built-chip';
    chip.textContent = item.word;
    // 點擊已選單字可退回重選
    chip.onclick = () => {
      builtWords.splice(arrPos, 1);
      const originalTile = poolBox.querySelector(`[data-index="${item.idx}"]`);
      if (originalTile) originalTile.classList.remove('used');
      updateSentenceSlots(stage, poolBox);
    };
    slotsBox.appendChild(chip);
  });

  // 當 4 個單字都選完時驗證句子
  if (builtWords.length === stage.words.length) {
    const userSentence = builtWords.map(i => i.word).join(' ');
    if (userSentence === stage.answer) {
      sfx.playSuccess();
      setTimeout(() => handleStageSuccess(stage), 450);
    } else {
      sfx.playGentleTryAgain();
      speakEnglish('Oops! Check the word order.');
      slotsBox.style.borderColor = '#ef4444';
      setTimeout(() => {
        // 自動清空讓孩子重新嘗試
        builtWords = [];
        poolBox.querySelectorAll('.btn-word-tile').forEach(b => b.classList.remove('used'));
        slotsBox.style.borderColor = '#60a5fa';
        updateSentenceSlots(stage, poolBox);
      }, 900);
    }
  }
}

// 處理關卡答對與寶石收集
function handleStageSuccess(stage) {
  if (typeof stage.rewardGemIndex === 'number') {
    collectedGems[stage.rewardGemIndex] = true;
    renderGemTracker();
  }

  feedbackTitle.textContent = stage.feedbackTitle;
  feedbackMessage.textContent = stage.feedback;
  feedbackOverlay.classList.add('show');
  speakEnglish(stage.feedback);
}

// 點擊「繼續冒險」進入下一關
nextStageBtn.onclick = () => {
  sfx.playMagicSparkle();
  feedbackOverlay.classList.remove('show');
  if (currentStageIndex + 1 < STORY_STAGES.length) {
    loadStage(currentStageIndex + 1);
  }
};

// 點擊上方舞台的魔法鑰匙 SVG 也會觸發閃亮音效與朗讀
magicKeyBtn.onclick = () => {
  sfx.playMagicSparkle();
  const stage = STORY_STAGES[currentStageIndex];
  if (stage.type === 'intro') {
    handleStageSuccess(stage);
  } else {
    speakEnglish(stage.readText);
  }
};

// 初始化啟動第一關
window.addEventListener('DOMContentLoaded', () => {
  renderGemTracker();
  loadStage(0);
});
</script>
